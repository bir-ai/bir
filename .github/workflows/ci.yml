name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  server:
    name: FastAPI server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # apps/server[dev] pulls the published bir-sdk package pinned in
      # apps/server/pyproject.toml for the SDK contract tests.
      - name: Install server with dev dependencies
        run: python -m pip install -e "apps/server[dev]" pyright

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run server tests with branch coverage
        working-directory: apps/server
        env:
          PYTHONWARNINGS: "error::ResourceWarning"
        run: |
          python -m coverage erase
          python -m coverage run -m pytest
          python -m coverage report

      - name: Run pyright
        run: pyright

  web:
    name: Web dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run lint
        working-directory: apps/web
        run: npm run lint

      - name: Run typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Run contract tests
        working-directory: apps/web
        run: npm run test

  fixtures:
    name: Contract fixture drift guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stdlib-only; no install step. Fails if a shared fixture no longer
      # matches tests/fixtures/CHECKSUMS.sha256. Keep this identical to the
      # bir-python (SDK) repo's fixtures job. See tests/fixtures/README.md.
      - name: Verify shared contract fixtures match the committed manifest
        run: python scripts/fixtures.py check
