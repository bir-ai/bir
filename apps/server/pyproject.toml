[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bir-server"
version = "0.1.0"
description = "Minimal FastAPI ingestion server for Bir traces."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    # The server's contract tests exercise the real SDK (configure/observe/
    # service+source metadata) and import private helpers from bir._sdk, so
    # the pin tracks one minor release at a time. Floor is 0.3.0 — verified
    # to keep those helpers — with an upper bound so a future release cannot
    # silently change the contract these tests rely on.
    "bir-sdk>=0.3.0,<0.4.0",
    "coverage[toml]>=7.0",
    "httpx>=0.27",
    "httpx2>=2.0.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 92.0
precision = 2
show_missing = true
skip_covered = true
